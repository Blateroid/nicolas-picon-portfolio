<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>ATP Complete 2 System Activation</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7eaed;color:#20343f;font:14px/1.5 Arial,sans-serif}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#f8fafb;border-bottom:1px solid #cbd6dc}button,select,a{font:inherit;font-size:12px;min-height:32px;padding:4px 12px;border:1px solid #b5c6ce;border-radius:4px;background:white;color:#20343f}button{cursor:pointer}button:hover,a:hover{background:#e8f1f5}button:active{background:#dae9ef}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #007b9d;outline-offset:2px}a{text-decoration:none;display:inline-flex;align-items:center}main{padding:16px;overflow:auto;min-height:600px}.sheet{margin:0 auto 16px;background:white;box-shadow:0 2px 12px #20343f20;max-width:none}.sheet canvas{display:block}.pageLabel{display:block;font-size:12px;padding:4px 12px;background:#f8fafb;border-top:1px solid #e1e7ea}#status{text-align:center;padding:24px}#status a{margin-top:16px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:480px){header{gap:4px;padding:8px}button,select,a{padding:4px 8px}main{padding:8px}}
</style></head><body><header aria-label="Document controls"><button id="previous" disabled aria-label="Previous page">←</button><label>Page <select id="page" aria-label="Go to page" disabled></select></label><span id="total">of 4</span><button id="next" disabled aria-label="Next page">→</button><select id="zoom" aria-label="Document zoom" disabled><option value="fit">Fit width</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select><a href="ATP_Complete_2_System_Activation.pdf" download>Download ↓</a></header><div id="status" role="status">Loading the guide…</div><main id="pages" aria-label="System activation guide pages" aria-busy="true"></main><script type="module">
const status=document.querySelector('#status'),main=document.querySelector('#pages'),select=document.querySelector('#page'),zoom=document.querySelector('#zoom'),prev=document.querySelector('#previous'),next=document.querySelector('#next');
let pdf,current=1,busy=false,resizeTimer;
function update(n){current=n;select.value=String(n);prev.disabled=n===1;next.disabled=n===pdf.numPages;}
function go(n){n=Math.min(pdf.numPages,Math.max(1,n));update(n);document.querySelector('#page-'+n).scrollIntoView({block:'start'});window.scrollBy(0,-document.querySelector('header').offsetHeight-8);}
async function render(){if(busy)return;busy=true;main.setAttribute('aria-busy','true');zoom.disabled=true;main.replaceChildren();try{for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),original=page.getViewport({scale:1});const available=document.documentElement.clientWidth-(innerWidth<480?16:32);const scale=zoom.value==='fit'?Math.min(available,1000)/original.width:Number(zoom.value);const viewport=page.getViewport({scale});const sheet=document.createElement('section');sheet.className='sheet';sheet.id='page-'+n;sheet.style.width=viewport.width+'px';sheet.setAttribute('aria-label','Document page '+n);sheet.style.scrollMarginTop='64px';const canvas=document.createElement('canvas'),ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';canvas.setAttribute('aria-hidden','true');sheet.append(canvas);const text=await page.getTextContent();const accessible=document.createElement('p');accessible.className='sr';accessible.textContent=text.items.map(x=>x.str||'').join(' ');sheet.append(accessible);const label=document.createElement('span');label.className='pageLabel';label.textContent='Page '+n+' of '+pdf.numPages;sheet.append(label);main.append(sheet);await page.render({canvasContext:canvas.getContext('2d'),canvas,viewport,transform:ratio===1?null:[ratio,0,0,ratio,0,0]}).promise;}status.hidden=true;}finally{busy=false;zoom.disabled=false;main.setAttribute('aria-busy','false');}}
try{const pdfjs=await import('./pdfjs/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='./pdfjs/pdf.worker.min.mjs';pdf=await pdfjs.getDocument({url:'ATP_Complete_2_System_Activation.pdf',isEvalSupported:false}).promise;document.querySelector('#total').textContent='of '+pdf.numPages;for(let n=1;n<=pdf.numPages;n++){const option=document.createElement('option');option.value=n;option.textContent=n;select.append(option);}await render();select.disabled=false;update(1);prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));select.addEventListener('change',()=>go(Number(select.value)));zoom.addEventListener('change',async()=>{await render();go(current);});window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(zoom.value==='fit')render().catch(fail);},200);});const observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting)update(Number(e.target.id.replace('page-','')));},{rootMargin:'-64px 0px -65% 0px'});for(const p of document.querySelectorAll('.sheet'))observer.observe(p);}catch(error){fail(error);}
function fail(error){status.hidden=false;status.textContent='The document could not be displayed here. ';const link=document.createElement('a');link.href='ATP_Complete_2_System_Activation.pdf';link.target='_blank';link.rel='noopener';link.textContent='Open the PDF directly ↗';status.append(link);main.setAttribute('aria-busy','false');console.error('Document viewer:',error);}
</script></body></html>
